version: '3.9'

services:
  gateway:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: api-llm-gateway
    ports:
      - "8080:8080"
    env_file:
      - .env
    environment:
      - LOG_LEVEL=info
    volumes:
      - ./src/config.yaml:/app/config.yaml:ro
    networks:
      - gateway-network
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080/health"]
      interval: 10s
      timeout: 3s
      start_period: 5s
      retries: 3
    restart: unless-stopped

networks:
  gateway-network:
    driver: bridge
    name: gateway-network
