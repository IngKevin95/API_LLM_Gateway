# config.yaml — API LLM Gateway (MVP Fase 1 con adaptadores implementados)
# Secretos siempre por referencia de entorno ${VAR}, nunca literales.

providers:
  - id: openai
    type: openai
    base_url: https://api.openai.com/v1
    api_key: ${OPENAI_API_KEY}
    max_in_flight: 300
    models:
      - name: gpt-4o
        capabilities: [chat, vision, reasoning]
        quality_score: 95
        latency_p50_ms: 800
        cost_per_1m_tokens: 15
        max_context_tokens: 128000

  - id: anthropic
    type: anthropic
    base_url: https://api.anthropic.com
    api_key: ${ANTHROPIC_API_KEY}
    max_in_flight: 250
    models:
      - name: claude-opus-4
        capabilities: [chat, reasoning, vision]
        quality_score: 92
        latency_p50_ms: 900
        cost_per_1m_tokens: 20
        max_context_tokens: 200000

  - id: local
    type: ollama
    base_url: http://localhost:11434
    max_in_flight: 50
    models:
      - name: mistral-7b
        capabilities: [chat, coding]
        quality_score: 70
        latency_p50_ms: 100
        cost_per_1m_tokens: 0
        max_context_tokens: 32000

  - id: google
    type: google
    base_url: https://generativelanguage.googleapis.com/v1beta
    api_key: ${GOOGLE_API_KEY}
    max_in_flight: 200
    models:
      - name: gemini-1.5-flash
        capabilities: [chat, vision]
        quality_score: 80
        latency_p50_ms: 600
        cost_per_1m_tokens: 0.075
        max_context_tokens: 1000000

  - id: aihubmix
    type: openai-compatible
    base_url: https://api.aihubmix.com/v1
    api_key: ${AIHUBMIX_API_KEY}
    max_in_flight: 100
    models:
      - name: gpt-3.5-turbo
        capabilities: [chat]
        quality_score: 75
        latency_p50_ms: 700
        cost_per_1m_tokens: 0.03
        max_context_tokens: 4096

  - id: omniroute
    type: openai-compatible
    base_url: http://omniroute:20128/v1
    max_in_flight: 100
    models:
      - name: gpt-3.5-turbo
        capabilities: [chat, coding]
        quality_score: 65
        latency_p50_ms: 150
        cost_per_1m_tokens: 0
        max_context_tokens: 4096

routing:
  capabilities:
    chat:
      providers: [omniroute, aihubmix, local, openai, anthropic, google]
      stream_idle_timeout_ms: 5000
    reasoning:
      providers: [anthropic, openai]
      stream_idle_timeout_ms: 60000
    vision:
      providers: [google, openai, anthropic]
      stream_idle_timeout_ms: 10000
    coding:
      providers: [local, anthropic]
      stream_idle_timeout_ms: 5000
