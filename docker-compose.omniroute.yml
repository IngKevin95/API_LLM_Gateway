version: '3.9'

services:
  omniroute:
    image: diegosouzapw/omniroute:latest
    container_name: omniroute-provider
    ports:
      - "20128:20128"
    environment:
      - PORT=20128
      - NODE_ENV=production
    networks:
      - gateway-network
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:20128/health"]
      interval: 10s
      timeout: 3s
      start_period: 10s
      retries: 3
    restart: unless-stopped

networks:
  gateway-network:
    driver: bridge
    name: gateway-network
    external: false
